[project]
name = "ai-testguard"
version = "1.0.0"
description = "Qualification QA d'un modèle de détection de fraude bancaire"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests coûteux (jeu complet) — exécutés manuellement ou planifiés",
    "perf: garde-fous de performance",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = ["N803", "N806", "S101", "S301", "S603", "S607", "S310", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
