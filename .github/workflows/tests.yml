name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Lancer aussi l'entraînement complet sur le jeu Kaggle (lent)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"   # chaque lundi 03:00 UTC : campagne complète

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Lint + tests rapides (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Ruff (style et erreurs statiques)
        run: ruff check --output-format=github .
      - name: Pytest + couverture
        run: >
          pytest -m "not slow" --cov=app --cov-report=term-missing
          --cov-report=xml --cov-fail-under=85 --junitxml=reports/junit.xml
      - name: Résumé de couverture
        if: always()
        run: |
          echo "### Couverture (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          python -c "import xml.etree.ElementTree as E; r=E.parse('coverage.xml').getroot(); print(f\"Taux de lignes couvertes : {float(r.get('line-rate'))*100:.1f} %\")" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            coverage.xml
            reports/junit.xml

  full:
    name: Campagne complète (jeu Kaggle, tests lents)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Télécharger le jeu complet et vérifier son empreinte
        run: |
          curl -sSL -o data/creditcard.csv https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv
          echo "76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89  data/creditcard.csv" | sha256sum -c -
      - name: Entraînement, évaluation et rapports
        run: |
          python scripts/run_experiment.py
          python scripts/robustness_report.py
          python scripts/compare_versions.py
          python scripts/performance_report.py
        env:
          PYTHONPATH: .
      - name: Tests lents (non-régression sur le jeu complet)
        run: pytest -m slow -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-campaign-reports
          path: reports/
